

services:

  postgres:
    image: postgres:16-alpine
    container_name: virs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virs123}
      POSTGRES_DB: ${POSTGRES_DB:-virs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - virs-net


  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virs-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false

    environment:

      HOST: 0.0.0.0
      PORT: "8080"


      RUST_LOG: ${RUST_LOG:-virs_app=info,virs_trading_bot=info,virs_position=info,virs_market=info,virs_api=info}
      FRONTEND_DIR: /app/frontend/dist

      STRATEGIES_DIR: /app/strategies

      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (must differ from LLM_KEY)}
      LLM_KEY: ${LLM_KEY:?LLM_KEY is required (must differ from ENCRYPTION_KEY)}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 chars)}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}

      DATABASE_URL: postgresql://${POSTGRES_USER:-virs}:${POSTGRES_PASSWORD:-virs123}@postgres:5432/${POSTGRES_DB:-virs}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-50}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (min 12 chars)}

      PROXY_URL: ${PROXY_URL:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy


    healthcheck:
      test: ["NONE"]
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - virs-net

volumes:
  postgres_data:
    driver: local

networks:
  virs-net:
    driver: bridge
