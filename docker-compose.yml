# ============================================================
# VIRS - Docker Compose (Monorepo Architecture)
# One-click deployment: docker compose up -d
# Copy .env.example to .env and modify as needed before starting
# ============================================================

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: virs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virs123}
      POSTGRES_DB: ${POSTGRES_DB:-virs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-virs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Postgres entrypoint runs as root, chowns the data dir, then uses gosu
    # to switch to the 'postgres' user. These caps are the minimum required
    # for that flow; all others are dropped.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - virs-net

  # ---- VIRS Backend ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virs-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # These override .env values because they use Docker internal hostnames
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Tracing filter: controls which logs are shown.
      # binance_api=info enables Binance REST API call logging (full URL + response).
      # Override in .env if you need to debug other modules (e.g. RUST_LOG=debug).
      RUST_LOG: ${RUST_LOG:-virs_app=info,virs_bot=info,virs_position=info,virs_market=info,virs_api=info,binance_api=info}
      FRONTEND_DIR: /app/frontend/dist
      # Security (MUST change in production)
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-64-char-string-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-to-another-random-64-char-string-must-differ-from-secret-key}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      # Database (Docker internal hostname)
      DATABASE_URL: postgresql://${POSTGRES_USER:-virs}:${POSTGRES_PASSWORD:-virs123}@postgres:5432/${POSTGRES_DB:-virs}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      DB_POOL_MAX: ${DB_POOL_MAX:-50}
      # Admin account (created on first startup)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Trading mode: true=paper(simulated), false=real exchange
      PAPER_TRADING: ${PAPER_TRADING:-true}
      # AI / LLM (at least one required for AI features)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Proxy (optional, for exchange API access)
      PROXY_URL: ${PROXY_URL:-}
      # Notification: Telegram (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Notification: Email SMTP (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@virs.com}
      # Cache TTL (seconds)
      CACHE_TTL_TICKER: ${CACHE_TTL_TICKER:-10}
      CACHE_TTL_KLINE_1M: ${CACHE_TTL_KLINE_1M:-60}
      CACHE_TTL_KLINE_5M: ${CACHE_TTL_KLINE_5M:-120}
      CACHE_TTL_KLINE_1H: ${CACHE_TTL_KLINE_1H:-300}
      CACHE_TTL_KLINE_1D: ${CACHE_TTL_KLINE_1D:-3600}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # distroless runtime has no shell/curl, so in-container HTTP health check
    # is disabled. To re-enable, add a --health-check subcommand to the binary
    # and switch to: test: ["CMD", "/app/virs", "--health-check"]
    healthcheck:
      test: ["NONE"]
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - virs-net

volumes:
  postgres_data:
    driver: local

networks:
  virs-net:
    driver: bridge
