[package]
name = "virs"
version = "0.1.0"
edition = "2021"
description = "VIRS - Next-Gen AI Quantitative Trading Platform"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# Redis (optional cache)
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"], optional = true }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"], default-features = false }

# WebSocket (for future real-time data)
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Configuration
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Error handling
anyhow = "1"
thiserror = "1"

# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

# Async utilities
async-trait = "0.1"
dashmap = "5"

# Notification (optional)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], optional = true }
teloxide = { version = "0.12", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["redis", "notification-email"]
redis = ["dep:redis"]
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]
notification-email = ["dep:lettre"]
notification-telegram = ["dep:teloxide"]
full = ["redis", "websocket", "notification-email", "notification-telegram"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
