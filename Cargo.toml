[workspace]
resolver = "2"
members = [

    "crates/foundation/virs-error",
    "crates/foundation/virs-task",

    "crates/infra/virs-type",
    "crates/infra/virs-utils",
    "crates/infra/virs-config",
    "crates/infra/virs-database",
    "crates/infra/virs-ws",
    "crates/infra/virs-llm",

    "crates/core/virs-indicator",
    "crates/core/virs-ccxt",
    "crates/core/virs-exchange",
    "crates/core/virs-prompt",

    "crates/services/virs-market",
    "crates/services/virs-position",
    "crates/services/virs-tactical-bot",
    "crates/services/virs-trading-bot",

    "crates/api/virs-api",

    "apps/server",
]

[workspace.dependencies]

serde = { version = "1", features = ["derive"] }
serde_json = "1"


tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }


chrono = { version = "0.4", features = ["serde"] }


uuid = { version = "1", features = ["v4", "v5", "serde"] }


async-trait = "0.1"


anyhow = "1"
thiserror = "1"


tracing = "0.1"


sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }


reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"], default-features = false }


tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }


futures-core = "0.3"
futures-util = "0.3"


dashmap = "5"


dotenvy = "0.15"


jsonwebtoken = "9"
bcrypt = "0.15"


aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["pkcs8", "pem", "rand_core"] }
hex = "0.4"
rand = "0.8"
base64 = "0.22"


axum = { version = "0.8.9", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }


talib-rs = "0.1"


tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


sysinfo = "0.32"


tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.dev]
opt-level = 0


[workspace.lints.rust]

unsafe_code = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]

too_many_arguments = "allow"
type_complexity = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"


clone_on_copy = "warn"
needless_return = "warn"
needless_borrow = "warn"
manual_strip = "warn"
manual_unwrap_or = "warn"
unnecessary_lazy_evaluations = "warn"
unnecessary_map_or = "warn"
unnecessary_cast = "warn"
collapsible_str_replace = "warn"
collapsible_match = "warn"
match_like_matches_macro = "warn"
question_mark = "warn"
new_without_default = "warn"
should_implement_trait = "warn"
doc_overindented_list_items = "warn"


dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
