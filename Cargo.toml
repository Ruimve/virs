[workspace]
resolver = "2"
members = [
    "crates/libs/virs-types",
    "crates/libs/virs-config",
    "crates/libs/virs-utils",
    "crates/libs/virs-models",
    "crates/libs/virs-ccxt",
    "crates/libs/virs-exchange",
    # Phase 5+:逐步添加
    # "crates/libs/virs-ai",
    "crates/services/virs-market",
    "crates/services/virs-position",
    "crates/services/virs-bot",
    "crates/services/virs-api",
    "app/virs-app",
]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Async utilities
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging & Tracing
tracing = "0.1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "gzip"], default-features = false }

# WebSocket client
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }

# Futures
futures-core = "0.3"
futures-util = "0.3"

# DashMap
dashmap = "5"

# Configuration
dotenvy = "0.15"

# Authentication
jsonwebtoken = "9"
bcrypt = "0.15"

# Cryptography
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

# Web framework
axum = { version = "0.8.9", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "fs"] }

# Technical analysis
talib-rs = "0.1"

# Tracing subscriber
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
