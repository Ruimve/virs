[package]
name = "virs-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "virs"
path = "src/main.rs"

[dependencies]
virs-bot = { path = "../../crates/services/virs-bot" }
virs-api = { path = "../../crates/services/virs-api" }
virs-strategy = { path = "../../crates/libs/virs-strategy" }
virs-indicator = { path = "../../crates/libs/virs-indicator" }
virs-types = { path = "../../crates/libs/virs-types" }
virs-error = { path = "../../crates/libs/virs-error", features = ["sqlx"] }
virs-config = { path = "../../crates/libs/virs-config" }
virs-utils = { path = "../../crates/libs/virs-utils" }
virs-exchange = { path = "../../crates/libs/virs-exchange" }
virs-ccxt = { path = "../../crates/libs/virs-ccxt" }
virs-market = { path = "../../crates/services/virs-market" }
virs-position = { path = "../../crates/services/virs-position" }
virs-task = { path = "../../crates/libs/virs-task" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
